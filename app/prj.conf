# Kernel: 10 kHz tick for the 1 kHz servo timer
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_ASSERT=y
CONFIG_POLL=y

# Double-precision FPU (Cortex-M7); several threads use it
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Drivers
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_CAN=y
CONFIG_HWINFO=y

# Watchdog: one task-watchdog channel per thread, IWDG as hardware fallback
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_REBOOT=y

# Diagnostics. Deferred logging, flushed promptly so test harnesses see events.
CONFIG_LOG=y
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=50
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_PROMPT_UART="motion:~$ "
CONFIG_BOOT_BANNER_STRING="Booting motion_fw"
